name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv export --no-dev --no-hashes --format requirements-txt > requirements.txt && uv run pip-audit -r requirements.txt

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: almox_test
          POSTGRES_USER: almox
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almox"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://almox:ci-only-password@localhost:5432/almox_test
      TEST_DATABASE_URL: postgresql://almox:ci-only-password@localhost:5432/almox_test
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: migrations sobem e descem
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head && uv run alembic downgrade base
      - name: testes no PostgreSQL
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: api-almoxarifado:ci
      - name: container sobe e responde
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e JWT_SECRET=ci-only-secret-with-more-than-32-characters \
            api-almoxarifado:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
