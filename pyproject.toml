[project]
name = "api-almoxarifado"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "PyJWT==2.14.0",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx2==2.13.0", "pip-audit==2.10.1", "pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]
"app/seed.py" = ["S105"]
